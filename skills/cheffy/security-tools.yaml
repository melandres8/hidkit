tools:
  gitleaks:
    version: "8.30.1"
    version_command: [gitleaks, version]
    install:
      darwin-arm64:
        url: "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_darwin_arm64.tar.gz"
        sha256: "b40ab0ae55c505963e365f271a8d3846efbc170aa17f2607f13df610a9aeb6a5"
        command: "curl -fsSLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_darwin_arm64.tar.gz && echo 'b40ab0ae55c505963e365f271a8d3846efbc170aa17f2607f13df610a9aeb6a5  gitleaks_8.30.1_darwin_arm64.tar.gz' | shasum -a 256 -c - && tar -xzf gitleaks_8.30.1_darwin_arm64.tar.gz gitleaks && mkdir -p ~/.local/bin && mv gitleaks ~/.local/bin/"
      linux-x64:
        url: "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz"
        sha256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        command: "curl -fsSLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz && echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks_8.30.1_linux_x64.tar.gz' | sha256sum -c - && tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks && mkdir -p ~/.local/bin && mv gitleaks ~/.local/bin/"
  osv-scanner:
    version: "2.6.0"
    version_command: [osv-scanner, --version]
    install:
      darwin-arm64:
        url: "https://github.com/google/osv-scanner/releases/download/v2.6.0/osv-scanner_darwin_arm64"
        sha256: "98c460dcd37de25819babd757d04542045b6243113e209edcd4d89fedb0256b4"
        command: "curl -fsSLo osv-scanner https://github.com/google/osv-scanner/releases/download/v2.6.0/osv-scanner_darwin_arm64 && echo '98c460dcd37de25819babd757d04542045b6243113e209edcd4d89fedb0256b4  osv-scanner' | shasum -a 256 -c - && chmod +x osv-scanner && mkdir -p ~/.local/bin && mv osv-scanner ~/.local/bin/"
      linux-x64:
        url: "https://github.com/google/osv-scanner/releases/download/v2.6.0/osv-scanner_linux_amd64"
        sha256: "ca69b3d3cd08f889a49dc0a383122f71cc528b83803671df5fd874d97485b108"
        command: "curl -fsSLo osv-scanner https://github.com/google/osv-scanner/releases/download/v2.6.0/osv-scanner_linux_amd64 && echo 'ca69b3d3cd08f889a49dc0a383122f71cc528b83803671df5fd874d97485b108  osv-scanner' | sha256sum -c - && chmod +x osv-scanner && mkdir -p ~/.local/bin && mv osv-scanner ~/.local/bin/"
  semgrep:
    version: "1.179.0"
    version_command: [semgrep, --version]
    install:
      darwin-arm64:
        url: "https://files.pythonhosted.org/packages/bd/77/b573a0faa5a5b0848dc884a0f8595fcb5c550f55fa5f455a233b29a52c0c/semgrep-1.179.0-cp310.cp311.cp312.cp313.cp314.py310.py311.py312.py313.py314-none-macosx_11_0_arm64.whl"
        sha256: "9b57026f587a4bc7833bca2b6e4d6778072a79dcf0b9f2e5e01d3d5df39c7759"
        command: "pipx install semgrep==1.179.0"
      linux-x64:
        url: "https://files.pythonhosted.org/packages/cc/6c/621944b4843c7484aeaefd5b232d93780bdf95259567c10a9a8129f08dc6/semgrep-1.179.0-cp310.cp311.cp312.cp313.cp314.py310.py311.py312.py313.py314-none-manylinux_2_34_x86_64.whl"
        sha256: "b529c4db63f293918989b84ce4640f12f1b1e4680d9e7fcab5f3554f9113dfc5"
        command: "pipx install semgrep==1.179.0"
checks:
  secrets:
    tool: gitleaks
    command: [gitleaks, dir, ".", "--redact=100", --no-banner, --exit-code, "1"]
  dependencies:
    tool: osv-scanner
    command: [osv-scanner, scan, source, -r, --allow-no-lockfiles, "."]
  sast:
    tool: semgrep
    command: [semgrep, scan, --config, p/default, --error, --metrics=off, --disable-version-check, "."]
    delta_args: [--baseline-commit, "{base}"]
ecosystems:
  node: [package-lock.json, pnpm-lock.yaml, yarn.lock]
  python: [poetry.lock, uv.lock, requirements.txt, Pipfile.lock]
  go: [go.sum]
  rust: [Cargo.lock]
  jvm: [gradle.lockfile, pom.xml]
